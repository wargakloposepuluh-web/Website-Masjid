<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="top-curve" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="bottom-curve" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>
  <!-- Lingkaran Luar Ganda Berwarna Tinta Stempel Ungu Khas -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#6b21a8" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#6b21a8" stroke-width="1.8" stroke-opacity="0.9"/>
  <!-- Lingkaran Dalam -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="#6b21a8" stroke-width="1.8" stroke-opacity="0.9"/>
  
  <!-- Teks Melengkung Atas -->
  <text font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#6b21a8" fill-opacity="0.9" letter-spacing="2">
    <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
      PENGURUS DKM AL-MUHAJIRIN
    </textPath>
  </text>
  
  <!-- Teks Melengkung Bawah -->
  <text font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#6b21a8" fill-opacity="0.9" letter-spacing="3">
    <textPath href="#bottom-curve" startOffset="50%" text-anchor="middle">
      JAKARTA SELATAN
    </textPath>
  </text>
  
  <!-- Bintang Sisi Kiri & Kanan -->
  <polygon points="26,100 28,103 33,103 29,106 30,110 26,108 22,110 23,106 19,103 24,103" fill="#6b21a8" fill-opacity="0.9"/>
  <polygon points="174,100 176,103 181,103 177,106 178,110 174,108 170,110 171,106 167,103 172,103" fill="#6b21a8" fill-opacity="0.9"/>
  
  <!-- Bagian Tengah Stempel -->
  <line x1="47" y1="88" x2="153" y2="88" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.9"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#6b21a8" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">SEKRETARIAT</text>
  <line x1="47" y1="112" x2="153" y2="112" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.9"/>
</svg>
